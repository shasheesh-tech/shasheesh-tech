<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Shasheesh — Noir Crimson Autonomous Command Center</title>
  <desc id="heroDesc">A dark noir crimson developer banner featuring an engineering grid, crimson core aura, status badge, quote, three modular tech cards, telemetry, sharp cursor pointer agents, and multi-colored shard bursts.</desc>
  <defs>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#17171a" stroke-width="1" fill="none" />
    </pattern>

    <radialGradient id="crimson-aura" cx="75%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-ambient" cx="20%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>

    <!-- Sharp Cursor Pointer Symbol -->
    <g id="pointer-glyph">
      <polygon
        points="0,0 0,22 6,17 11,26 15,24 10,15 17.5,15"
        fill="#f4f4f5"
        stroke="#09090b"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </g>

    <filter id="crimson-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="380" fill="#08080a" />
  <rect width="1200" height="380" fill="url(#grid-pattern)" />
  <rect width="1200" height="380" fill="url(#cyan-ambient)" />
  <rect width="1200" height="380" fill="url(#crimson-aura)" />

  <!-- Outer Frame & Crimson Edge Accent Bar -->
  <rect x="14" y="14" width="1172" height="352" rx="10" fill="none" stroke="#27272a" stroke-width="1.5" />
  <rect x="14" y="14" width="6" height="352" rx="3" fill="#dc2626" filter="url(#crimson-glow)" />

  <!-- Top Status Pill: Tagline & Active Signal -->
  <rect x="54" y="38" width="280" height="26" rx="4" fill="#180b0e" stroke="#7f1d1d" stroke-width="1" />
  <circle cx="70" cy="51" r="4.5" fill="#ef4444" filter="url(#crimson-glow)" />
  <circle cx="70" cy="51" r="2" fill="#ffffff" />
  <text x="84" y="55" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#fca5a5">SYSTEM // ACTIVE · CSE &amp; AI BUILDER</text>

  <!-- Right Header Telemetry -->
  <text x="1150" y="55" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="0.6" fill="#52525b">SHASHEESH-TECH // NOIR CRIMSON ENGINE</text>

  <!-- SLOT 1: NAME -->
  <text x="54" y="116" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#f4f4f5">SHASHEESH</text>
  <text x="360" y="112" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#ef4444">[CSE STUDENT · SYSTEMS BUILDER]</text>

  <!-- SLOT 2: QUOTE / MOTTO -->
  <rect x="54" y="136" width="3.5" height="38" fill="#dc2626" rx="1.5" />
  <text x="68" y="159" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15.5" font-style="italic" letter-spacing="0.2" fill="#e4e4e7">"Real growth comes from shipping real projects — breaking things, fixing them, and building sharper systems every cycle."</text>

  <!-- SLOT 3: CARD 1 - CORE STACK -->
  <rect x="54" y="196" width="360" height="58" rx="8" fill="#0f0f13" stroke="#27272a" stroke-width="1" />
  <rect x="66" y="208" width="6" height="6" rx="1" fill="#22d3ee" />
  <text x="78" y="214" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#22d3ee">CORE STACK // HIGH CONCURRENCY &amp; AI</text>
  <text x="66" y="238" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" font-weight="500" letter-spacing="0.5" fill="#d4d4d8">C++ · TypeScript · Python · React · FastAPI · Neo4j</text>

  <!-- SLOT 4: CARD 2 - KEY HIGHLIGHTS -->
  <rect x="430" y="196" width="370" height="58" rx="8" fill="#0f0f13" stroke="#27272a" stroke-width="1" />
  <rect x="442" y="208" width="6" height="6" rx="1" fill="#facc15" />
  <text x="454" y="214" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#facc15">KEY BUILDS // HACKATHONS &amp; PLATFORMS</text>
  <text x="442" y="238" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" font-weight="500" letter-spacing="0.5" fill="#d4d4d8">TrustGuardian (IARE 2nd) · FOCUS · AIMGOD</text>

  <!-- SLOT 5: CARD 3 - FOUNDATIONS -->
  <rect x="816" y="196" width="330" height="58" rx="8" fill="#0f0f13" stroke="#27272a" stroke-width="1" />
  <rect x="828" y="208" width="6" height="6" rx="1" fill="#a855f7" />
  <text x="840" y="214" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#a855f7">FOUNDATIONS // PERSISTENCE &amp; DATA</text>
  <text x="828" y="238" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" font-weight="500" letter-spacing="0.5" fill="#d4d4d8">StockSense · Hospital C++ · DSL Trees</text>

  <!-- FOOTER TELEMETRY -->
  <text x="54" y="296" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" letter-spacing="0.8" fill="#a1a1aa">[STATUS: 5 Public Repos · Enterprise Trust Scoring · Multi-Agent Orchestration · 3D Web]</text>
  <text x="54" y="324" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="0.6" fill="#52525b">LATENCY: OPTIMAL · PERSISTENCE: READY · ARCHITECTURE: PRODUCTION AGENTS</text>

  <!-- SHARD BURST SPARKS (Geometric Triangles around cursor impact zones) -->
  <g id="shards-burst-group" opacity="0.9">
    <!-- Crimson Shards near Name Cursor -->
    <polygon points="310,85 315,95 306,97" fill="#ef4444" transform="rotate(25 310 90)" />
    <polygon points="325,102 331,110 322,112" fill="#f4f4f5" transform="rotate(-40 325 105)" />
    <polygon points="295,115 302,122 293,126" fill="#fb7185" transform="rotate(70 295 120)" />

    <!-- Silver & Crimson Shards near Quote Cursor -->
    <polygon points="510,140 516,149 507,152" fill="#f4f4f5" transform="rotate(15 510 145)" />
    <polygon points="528,162 534,171 524,173" fill="#ef4444" transform="rotate(-60 528 165)" />

    <!-- Cyan Shards near Stack Card Cursor -->
    <polygon points="250,210 257,219 248,222" fill="#22d3ee" transform="rotate(45 250 215)" />
    <polygon points="268,230 274,237 265,241" fill="#f4f4f5" transform="rotate(-30 268 235)" />

    <!-- Amber Shards near Key Builds Cursor -->
    <polygon points="635,210 642,220 632,223" fill="#facc15" transform="rotate(80 635 215)" />
    <polygon points="650,230 657,238 647,242" fill="#f4f4f5" transform="rotate(-15 650 235)" />

    <!-- Violet Shards near Foundations Cursor -->
    <polygon points="1005,210 1012,220 1002,222" fill="#a855f7" transform="rotate(-45 1005 215)" />
    <polygon points="1022,230 1029,239 1019,242" fill="#22d3ee" transform="rotate(65 1022 235)" />
  </g>

  <!-- Sharp Cursor Agents with Halos & Labels -->
  <!-- Cursor 1: BUILD (Crimson) -->
  <g transform="translate(305, 92)">
    <circle cx="8" cy="10" r="16" fill="#ef4444" fill-opacity="0.32" />
    <use href="#pointer-glyph" />
    <rect x="18" y="14" width="46" height="16" rx="3" fill="#180b0e" stroke="#ef4444" stroke-width="0.8" />
    <text x="41" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="700" fill="#fca5a5">BUILD</text>
  </g>

  <!-- Cursor 2: SECURE (Silver) -->
  <g transform="translate(515, 150)">
    <circle cx="8" cy="10" r="16" fill="#f4f4f5" fill-opacity="0.25" />
    <use href="#pointer-glyph" />
    <rect x="18" y="14" width="50" height="16" rx="3" fill="#18181b" stroke="#a1a1aa" stroke-width="0.8" />
    <text x="43" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="700" fill="#f4f4f5">SECURE</text>
  </g>

  <!-- Cursor 3: SCALE (Cyan) -->
  <g transform="translate(255, 218)">
    <circle cx="8" cy="10" r="16" fill="#22d3ee" fill-opacity="0.3" />
    <use href="#pointer-glyph" />
    <rect x="18" y="14" width="48" height="16" rx="3" fill="#082f49" stroke="#22d3ee" stroke-width="0.8" />
    <text x="42" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="700" fill="#a5f3fc">SCALE</text>
  </g>

  <!-- Cursor 4: ANALYZE (Amber) -->
  <g transform="translate(640, 218)">
    <circle cx="8" cy="10" r="16" fill="#facc15" fill-opacity="0.3" />
    <use href="#pointer-glyph" />
    <rect x="18" y="14" width="52" height="16" rx="3" fill="#451a03" stroke="#facc15" stroke-width="0.8" />
    <text x="44" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="700" fill="#fef08a">ANALYZE</text>
  </g>

  <!-- Cursor 5: SHIP (Violet) -->
  <g transform="translate(1010, 218)">
    <circle cx="8" cy="10" r="16" fill="#a855f7" fill-opacity="0.3" />
    <use href="#pointer-glyph" />
    <rect x="18" y="14" width="44" height="16" rx="3" fill="#2e1065" stroke="#a855f7" stroke-width="0.8" />
    <text x="40" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="700" fill="#e9d5ff">SHIP</text>
  </g>
</svg>
