<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Shasheesh — Developer Command Center</title>
  <desc id="heroDesc">A dark developer command center with an engineering grid, circuit paths, interface panels, project nodes, and four labeled cursor pointers (BUILD, SECURE, ANALYZE, SHIP) converging on the central SHASHEESH mark. Colors: charcoal background with electric cyan, violet, and amber accents.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c14"/>
      <stop offset=".5" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#0a1218"/>
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a67cff"/>
      <stop offset="1" stop-color="#a67cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amberBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset=".5" stop-color="#74f7ff"/>
      <stop offset="1" stop-color="#a67cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f5d4" stroke-opacity=".05" stroke-width=".5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>

  <!-- Circuit paths -->
  <g stroke="#00f5d4" stroke-opacity=".12" stroke-width="1" fill="none">
    <path d="M0 320 Q200 280 400 310 T800 290 T1200 260"/>
    <path d="M0 80 Q300 120 500 90 T900 110 T1200 80"/>
    <path d="M200 0 L200 60 L340 60"/>
    <path d="M1000 400 L1000 340 L860 340"/>
    <path d="M600 400 L600 360"/>
    <path d="M600 0 L600 40"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#00f5d4" opacity=".3">
    <circle cx="200" cy="60" r="3"/>
    <circle cx="340" cy="60" r="2"/>
    <circle cx="1000" cy="340" r="3"/>
    <circle cx="860" cy="340" r="2"/>
    <circle cx="600" cy="360" r="2"/>
    <circle cx="600" cy="40" r="2"/>
  </g>

  <!-- Left interface panel -->
  <g opacity=".6">
    <rect x="40" y="100" width="180" height="120" rx="6" fill="none" stroke="#00f5d4" stroke-opacity=".2" stroke-width="1"/>
    <rect x="48" y="108" width="80" height="4" rx="2" fill="#00f5d4" opacity=".3"/>
    <rect x="48" y="118" width="164" height="1" fill="#00f5d4" opacity=".1"/>
    <rect x="48" y="128" width="120" height="3" rx="1.5" fill="#a67cff" opacity=".25"/>
    <rect x="48" y="138" width="90" height="3" rx="1.5" fill="#a67cff" opacity=".15"/>
    <rect x="48" y="148" width="140" height="3" rx="1.5" fill="#00f5d4" opacity=".2"/>
    <rect x="48" y="162" width="164" height="1" fill="#00f5d4" opacity=".1"/>
    <circle cx="56" cy="178" r="4" fill="none" stroke="#00f5d4" stroke-opacity=".3"/>
    <circle cx="56" cy="178" r="1.5" fill="#00f5d4" opacity=".5"/>
    <text x="66" y="181" font-family="Consolas,monospace" font-size="8" fill="#00f5d4" opacity=".4">TRUST_ENGINE</text>
    <circle cx="56" cy="196" r="4" fill="none" stroke="#ffb347" stroke-opacity=".3"/>
    <circle cx="56" cy="196" r="1.5" fill="#ffb347" opacity=".5"/>
    <text x="66" y="199" font-family="Consolas,monospace" font-size="8" fill="#ffb347" opacity=".4">INVENTORY_SYS</text>
  </g>

  <!-- Right interface panel -->
  <g opacity=".6">
    <rect x="980" y="80" width="180" height="100" rx="6" fill="none" stroke="#a67cff" stroke-opacity=".2" stroke-width="1"/>
    <rect x="988" y="88" width="60" height="4" rx="2" fill="#a67cff" opacity=".3"/>
    <rect x="988" y="98" width="164" height="1" fill="#a67cff" opacity=".1"/>
    <rect x="988" y="108" width="40" height="40" rx="4" fill="none" stroke="#00f5d4" stroke-opacity=".15"/>
    <rect x="1038" y="108" width="40" height="40" rx="4" fill="none" stroke="#a67cff" stroke-opacity=".15"/>
    <rect x="1088" y="108" width="40" height="40" rx="4" fill="none" stroke="#ffb347" stroke-opacity=".15"/>
    <text x="996" y="132" font-family="Consolas,monospace" font-size="7" fill="#00f5d4" opacity=".35">AI</text>
    <text x="1046" y="132" font-family="Consolas,monospace" font-size="7" fill="#a67cff" opacity=".35">SYS</text>
    <text x="1092" y="132" font-family="Consolas,monospace" font-size="7" fill="#ffb347" opacity=".35">SHIP</text>
    <rect x="988" y="156" width="100" height="3" rx="1.5" fill="#a67cff" opacity=".2"/>
    <rect x="988" y="166" width="70" height="3" rx="1.5" fill="#00f5d4" opacity=".15"/>
  </g>

  <!-- Cursor trails — four pointers converging -->
  <!-- BUILD cursor trail (from top-left) -->
  <g filter="url(#softGlow)">
    <path d="M120 30 L300 140 L420 170" stroke="#00f5d4" stroke-width="1.5" stroke-opacity=".5" fill="none" stroke-dasharray="4 3"/>
    <circle cx="120" cy="30" r="4" fill="#00f5d4" opacity=".7"/>
    <text x="100" y="22" font-family="Consolas,monospace" font-size="9" font-weight="700" fill="#00f5d4" opacity=".8">BUILD</text>
  </g>

  <!-- SECURE cursor trail (from bottom-left) -->
  <g filter="url(#softGlow)">
    <path d="M80 370 L260 280 L420 220" stroke="#a67cff" stroke-width="1.5" stroke-opacity=".5" fill="none" stroke-dasharray="4 3"/>
    <circle cx="80" cy="370" r="4" fill="#a67cff" opacity=".7"/>
    <text x="56" y="385" font-family="Consolas,monospace" font-size="9" font-weight="700" fill="#a67cff" opacity=".8">SECURE</text>
  </g>

  <!-- ANALYZE cursor trail (from top-right) -->
  <g filter="url(#softGlow)">
    <path d="M1100 20 L900 130 L780 170" stroke="#ffb347" stroke-width="1.5" stroke-opacity=".5" fill="none" stroke-dasharray="4 3"/>
    <circle cx="1100" cy="20" r="4" fill="#ffb347" opacity=".7"/>
    <text x="1070" y="14" font-family="Consolas,monospace" font-size="9" font-weight="700" fill="#ffb347" opacity=".8">ANALYZE</text>
  </g>

  <!-- SHIP cursor trail (from bottom-right) -->
  <g filter="url(#softGlow)">
    <path d="M1120 380 L940 290 L780 220" stroke="#00f5d4" stroke-width="1.5" stroke-opacity=".4" fill="none" stroke-dasharray="4 3"/>
    <circle cx="1120" cy="380" r="4" fill="#00f5d4" opacity=".6"/>
    <text x="1098" y="395" font-family="Consolas,monospace" font-size="9" font-weight="700" fill="#00f5d4" opacity=".7">SHIP</text>
  </g>

  <!-- Central composition area -->
  <!-- Name block -->
  <g font-family="Segoe UI,Arial,sans-serif" fill="#ecfeff">
    <text x="420" y="130" font-size="11" letter-spacing="6" fill="#00f5d4" opacity=".7" font-family="Consolas,monospace">AI · SYSTEMS · FULL-STACK BUILDING</text>
    <text x="410" y="210" font-size="72" font-weight="800" letter-spacing="2" filter="url(#glow)">SHASHEESH</text>
    <text x="420" y="248" font-size="15" letter-spacing="3" fill="#8fa3c3">CSE STUDENT · PROJECT MAKER · BUILDER</text>
  </g>

  <!-- Accent line under name -->
  <line x1="420" y1="268" x2="790" y2="268" stroke="url(#accentLine)" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Project nodes along bottom -->
  <g font-family="Consolas,monospace" font-size="8">
    <!-- TrustGuardian node -->
    <circle cx="300" cy="310" r="5" fill="none" stroke="#00f5d4" stroke-opacity=".5"/>
    <circle cx="300" cy="310" r="2" fill="#00f5d4" opacity=".6"/>
    <text x="280" y="328" fill="#00f5d4" opacity=".45">TRUSTGUARDIAN</text>

    <!-- FOCUS node -->
    <circle cx="460" cy="320" r="5" fill="none" stroke="#a67cff" stroke-opacity=".5"/>
    <circle cx="460" cy="320" r="2" fill="#a67cff" opacity=".6"/>
    <text x="445" y="338" fill="#a67cff" opacity=".45">FOCUS</text>

    <!-- AIMGOD node -->
    <circle cx="600" cy="310" r="5" fill="none" stroke="#ffb347" stroke-opacity=".5"/>
    <circle cx="600" cy="310" r="2" fill="#ffb347" opacity=".6"/>
    <text x="577" y="328" fill="#ffb347" opacity=".45">AIMGOD</text>

    <!-- StockSense node -->
    <circle cx="740" cy="320" r="5" fill="none" stroke="#00f5d4" stroke-opacity=".5"/>
    <circle cx="740" cy="320" r="2" fill="#00f5d4" opacity=".6"/>
    <text x="717" y="338" fill="#00f5d4" opacity=".45">STOCKSENSE</text>

    <!-- C++ node -->
    <circle cx="890" cy="310" r="5" fill="none" stroke="#a67cff" stroke-opacity=".5"/>
    <circle cx="890" cy="310" r="2" fill="#a67cff" opacity=".6"/>
    <text x="878" y="328" fill="#a67cff" opacity=".45">C++</text>

    <!-- Connection lines between nodes -->
    <line x1="305" y1="310" x2="455" y2="320" stroke="#00f5d4" stroke-opacity=".1"/>
    <line x1="465" y1="320" x2="595" y2="310" stroke="#a67cff" stroke-opacity=".1"/>
    <line x1="605" y1="310" x2="735" y2="320" stroke="#ffb347" stroke-opacity=".1"/>
    <line x1="745" y1="320" x2="885" y2="310" stroke="#00f5d4" stroke-opacity=".1"/>
  </g>

  <!-- Status bar -->
  <g fill="#8fa3c3" font-family="Consolas,monospace" font-size="10" letter-spacing="2">
    <text x="40" y="30">[ BUILD MODE: ACTIVE ]</text>
    <text x="980" y="380">CORE // v2.0</text>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#00f5d4" stroke-opacity=".15"/>
</svg>
